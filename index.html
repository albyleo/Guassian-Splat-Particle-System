<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hibiscus</title>
  <meta name="description" content="Un ibisco rosso che si scompone in linee vive al tocco.">
  <style>
    :root {
      --bg: #000;
      --ink: #f3e9e6;
      --muted: rgba(243, 233, 230, 0.55);
      --accent: #e0303a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; outline: none; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 8px 14px;
      border: 1px solid rgba(224, 48, 58, 0.6);
      border-radius: 999px;
      font-size: 13px;
      color: var(--ink);
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: opacity 0.8s ease;
      white-space: nowrap;
    }
    .hint.is-hidden { opacity: 0; }
    .hint::before {
      content: "";
      display: inline-block;
      width: 7px; height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.7); } }

    .status {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      font-size: 13px; color: var(--muted);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="status" id="status">caricamento…</div>
  <div class="hint is-hidden" id="hint">Tocca il fiore · trascina per inclinarlo</div>

  <script type="module">
    import { createHibiscus } from './hibiscus.js';

    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    const hint = document.getElementById('hint');

    try {
      const fx = await createHibiscus(stage);
      window.hibiscus = fx;               // es. hibiscus.set(1) dalla console o da GSAP
      status.remove();
      hint.classList.remove('is-hidden');
      stage.addEventListener('hibiscus:touch', () => hint.classList.add('is-hidden'), { once: true });
      console.log(`[hibiscus] ${fx.points} punti, ${fx.segments} segmenti`);
    } catch (err) {
      status.textContent = 'Non riesco a caricare l’effetto: ' + err.message;
      console.error(err);
    }
  </script>
</body>
</html>
