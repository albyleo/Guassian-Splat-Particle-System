<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hibiscus</title>
  <meta name="description" content="Un ibisco rosso che si scompone in linee vive al tocco.">
  <style>
    :root {
      --bg: #000;
      --ink: #f3e9e6;
      --muted: rgba(243, 233, 230, 0.55);
      --accent: #e0303a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; outline: none; }

    .logout { position: fixed; z-index: 1; top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); }
    .logout button { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; }
    .logout button:hover { color: var(--accent); }
    .logout button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .status {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      font-size: 13px; color: var(--muted);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <form class="logout" method="post" action="/logout">
    <button type="submit" aria-label="Esci e torna all’accesso">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
    </button>
  </form>
  <div id="stage"></div>
  <div class="status" id="status">caricamento…</div>

  <script type="module">
    import { createHibiscus } from './hibiscus.js';

    const stage = document.getElementById('stage');
    const status = document.getElementById('status');

    try {
      const fx = await createHibiscus(stage);
      window.hibiscus = fx;               // es. hibiscus.set(1) dalla console o da GSAP
      status.remove();
      console.log(`[hibiscus] ${fx.points} punti, ${fx.segments} segmenti`);
    } catch (err) {
      status.textContent = 'Non riesco a caricare l’effetto: ' + err.message;
      console.error(err);
    }
  </script>
</body>
</html>
